# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New → Blueprint → connect DADA-NAMEROLOGY-Admin.
# VITE_API_URL is baked in at build time, so changing it needs a redeploy
# (Manual Deploy → Clear build cache & deploy).
services:
  - type: web
    name: dada-numerology-admin
    runtime: static
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Full base URL of the API, e.g. https://dada-numerology-api.onrender.com/api/v1
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: every unknown path is served by index.html so deep
      # links like /users/abc123 work on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
